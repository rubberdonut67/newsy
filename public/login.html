<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Newsy — sign in</title>
    <link rel="icon" href="/favicon.svg" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="login-wrap">
      <form class="card login-card" id="login-form">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="1" y="1" width="22" height="22" rx="6.5" fill="#2f6bff" />
          <path d="M6 8h10M6 12h10M6 16h6" stroke="#fff" stroke-width="1.9" stroke-linecap="round" fill="none" />
          <circle cx="17.6" cy="16.4" r="2.9" fill="#fff" />
          <circle cx="17.6" cy="16.4" r="1.3" fill="#2f6bff" />
        </svg>
        <h1>Newsy</h1>
        <input type="password" name="password" placeholder="Password" required autofocus />
        <button class="btn btn-primary" type="submit">Sign in</button>
        <p class="error hidden" id="login-error"></p>
      </form>
    </div>

    <script type="module">
      const form = document.querySelector('#login-form');
      const error = document.querySelector('#login-error');

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        error.classList.add('hidden');
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ password: form.password.value }),
        });
        if (res.ok) {
          location.href = '/';
          return;
        }
        const data = await res.json().catch(() => ({}));
        error.textContent = data.error || 'Sign in failed';
        error.classList.remove('hidden');
        form.password.select();
      });
    </script>
  </body>
</html>
