<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Newsy isn't running</title>
    <style>
      :root {
        --bg: #f6f7f9;
        --surface: #ffffff;
        --border: #dfe3ea;
        --text: #14171f;
        --muted: #5f6875;
        --accent: #2f6bff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b0d12;
          --surface: #141821;
          --border: #262c39;
          --text: #e7eaf0;
          --muted: #99a2b3;
          --accent: #6f9bff;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--text);
        font: 15px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      .card {
        max-width: 30rem;
        padding: 2rem;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.25rem;
      }
      p {
        margin: 0 0 1rem;
        color: var(--muted);
      }
      code {
        display: block;
        padding: 0.6rem 0.8rem;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
        font-size: 13px;
        color: var(--text);
        overflow-x: auto;
        white-space: nowrap;
      }
      button {
        margin-top: 1.25rem;
        padding: 0.55rem 1rem;
        font: inherit;
        color: #fff;
        background: var(--accent);
        border: 0;
        border-radius: 8px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>📰 Newsy isn't answering</h1>
      <p>
        The desktop shell is a window onto the Newsy service — it doesn't collect news itself, so
        there's nothing to show until the service is up. Alerts are paused while it's down.
      </p>
      <p>Start it from a terminal:</p>
      <code>.\newsy.cmd start</code>
      <button id="retry">Try again</button>
      <script>
        // Reloading this file would only ever show this file again; the shell has
        // to re-probe the service and swap the window over on success.
        const button = document.getElementById('retry');
        button.addEventListener('click', async () => {
          button.disabled = true;
          button.textContent = 'Checking…';
          const alive = await window.newsy?.retry();
          if (!alive) {
            button.disabled = false;
            button.textContent = 'Still down — try again';
          }
        });
      </script>
    </main>
  </body>
</html>
